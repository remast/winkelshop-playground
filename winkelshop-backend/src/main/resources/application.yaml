spring:
  application:
    name: winkelshop
  datasource:
    url: jdbc:h2:mem:winkelshop;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  docker:
    compose:
      enabled: false
  mvc:
    problemdetails:
      enabled: true
h2:
  console:
    enabled: true
