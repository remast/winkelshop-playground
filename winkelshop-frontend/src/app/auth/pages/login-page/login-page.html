<main class="login-shell" aria-labelledby="login-title">
  <section class="login-card" aria-describedby="login-subline">
    <p class="kicker">✨ Winkelshop</p>
    <h1 id="login-title">🪄 Magische Anmeldung</h1>
    <p id="login-subline" class="subline">Melde dich an, um den Shop und Warenkorb zu nutzen. 🌙</p>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-field">
        <label for="email">📜 E-Mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          autocomplete="email"
          [attr.aria-invalid]="emailHasError()"
          [attr.aria-describedby]="emailHasError() ? 'email-error' : null"
        />
        @if (emailHasError()) {
          <p id="email-error" class="error-text">Bitte gib eine gueltige E-Mail-Adresse ein.</p>
        }
      </div>

      <div class="form-field">
        <label for="password">🔐 Passwort</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [attr.aria-invalid]="passwordHasError()"
          [attr.aria-describedby]="passwordHasError() ? 'password-error' : null"
        />
        @if (passwordHasError()) {
          <p id="password-error" class="error-text">Bitte gib dein Passwort ein.</p>
        }
      </div>

      <button type="submit" [disabled]="isSubmitting()" class="submit-button">
        @if (isSubmitting()) {
          ✨ Anmelden...
        } @else {
          🧙 Anmelden
        }
      </button>
    </form>

    @if (errorMessage(); as message) {
      <div class="message" role="alert" aria-live="assertive">
        {{ message }}
      </div>
    }
  </section>
</main>
